{{ define "main" }}
<section class="taxonomy-page tags-page">
  <header class="tags-hero">
    <div>
      <h1 class="page-title">标签</h1>
      <p class="page-description">共 {{ len .Data.Terms }} 个标签</p>
    </div>
    <div class="tag-filter-wrap">
      <svg class="tag-filter-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input class="tag-filter-input" type="search" data-tag-filter placeholder="筛选标签..." aria-label="筛选标签" autocomplete="off" spellcheck="false">
    </div>
  </header>

  <div class="tag-cloud" data-tag-cloud>
    {{ range .Data.Terms.ByCount }}
      {{ $tier := "base" }}
      {{ if ge .Count 3 }}
        {{ $tier = "high" }}
      {{ else if eq .Count 2 }}
        {{ $tier = "medium" }}
      {{ end }}
      <a class="tag-chip" href="{{ .Page.RelPermalink }}" data-tag-name="{{ lower .Page.Title }}" data-tag-tier="{{ $tier }}">
        <span class="tag-chip-hash" aria-hidden="true">#</span>
        <span class="tag-chip-label">{{ .Page.Title }}</span>
        <span class="tag-chip-count">{{ .Count }}</span>
      </a>
    {{ else }}
      <p class="post-empty">暂无标签。</p>
    {{ end }}
  </div>

  <p class="tag-filter-empty" data-tag-empty hidden>没有找到匹配的标签。</p>
</section>
{{ end }}

{{- $src := .Get "src" | default (.Get 0) -}}
{{- $dark := .Get "dark" -}}
{{- $alt := .Get "alt" | default "流程图" -}}
{{- $caption := .Get "caption" -}}
{{- $invert := ne (.Get "invert") "false" -}}
{{- if not $src -}}
  {{- errorf "excalidraw shortcode requires a src argument" -}}
{{- end -}}
<figure class="diagram-figure diagram-excalidraw">
  <div class="diagram-images">
    <img class="diagram-image{{ if $dark }} diagram-image-light{{ else if $invert }} diagram-image-auto-dark{{ end }}" src="{{ $src | relURL }}" alt="{{ $alt }}" loading="lazy" decoding="async">
    {{- with $dark }}
      <img class="diagram-image diagram-image-dark" src="{{ . | relURL }}" alt="{{ $alt }}" loading="lazy" decoding="async">
    {{- end }}
  </div>
  {{- with $caption }}
    <figcaption class="diagram-caption">{{ . }}</figcaption>
  {{- end }}
</figure>

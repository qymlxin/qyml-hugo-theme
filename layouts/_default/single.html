{{ define "main" }}
<article class="post">
  <header class="post-header">
    <h1>{{ .Title }}</h1>

    <div class="post-meta">
      {{ with .Date }}
        <time datetime="{{ .Format "2006-01-02" }}">{{ .Format "2006-01-02" }}</time>
      {{ end }}
      <span>{{ .ReadingTime }} 分钟阅读</span>
    </div>
  </header>

  <div class="post-content">
    {{ .Content }}
  </div>

  {{ partial "comments.html" . }}
</article>
{{ end }}

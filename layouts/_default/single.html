{{ define "main" }}
<article class="post">
  <header class="post-header">
    {{ with .Params.categories }}
      <div class="post-cats post-header-cats">
        {{ range . }}<span class="post-cat">{{ . }}</span>{{ end }}
      </div>
    {{ end }}
    <h1>{{ .Title }}</h1>

    <div class="post-meta">
      {{ with .Date }}
        <time datetime="{{ .Format "2006-01-02" }}">{{ .Format "2006-01-02" }}</time>
      {{ end }}
      <span class="post-meta-divider" aria-hidden="true">·</span>
      <span>{{ .ReadingTime }} 分钟阅读</span>
      {{ with .Params.tags }}
        <span class="post-meta-divider" aria-hidden="true">·</span>
        <span>{{ delimit . "、" }}</span>
      {{ end }}
    </div>
  </header>

  <div class="post-content">
    {{ .Content }}
  </div>

  {{ partial "comments.html" . }}
</article>
{{ end }}

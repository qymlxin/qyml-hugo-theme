<!doctype html>
<html lang="{{ site.Language.Locale | default "zh-cn" }}">
<head>
  <script>
    (() => {
      const storedTheme = localStorage.getItem("theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const isDark = storedTheme === "dark" || (!storedTheme && prefersDark);
      if (isDark) {
        document.documentElement.dataset.theme = "dark";
        document.documentElement.style.background = "#151921";
      } else if (storedTheme === "light") {
        document.documentElement.dataset.theme = "light";
        document.documentElement.style.background = "#f2f3f5";
      }
    })();
  </script>
  {{ partial "head.html" . }}
</head>
<body class="kind-{{ .Kind }}{{ with .Layout }} layout-{{ . }}{{ end }}">
  {{ partial "header.html" . }}
  {{ if eq .Kind "page" }}
    <div class="reading-progress" data-reading-progress aria-hidden="true"></div>
  {{ end }}

  <main class="site-main">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}

  {{/* Spotlight 搜索弹层 */}}
  <div class="search-modal" data-search-root data-search-index="{{ "index.json" | relURL }}">
    <div class="search-backdrop" data-search-backdrop hidden aria-hidden="true"></div>
    <div class="search-panel" id="site-search-panel" data-search-panel role="dialog" aria-modal="true" aria-label="搜索文章" hidden>
      <div class="search-panel-head">
        <svg class="search-panel-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input class="search-input" type="search" data-search-input placeholder="搜索文章标题、标签或正文关键词..." autocomplete="off" spellcheck="false">
        <button class="search-clear" type="button" data-search-clear aria-label="清空输入" title="清空" hidden>
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <button class="search-esc" type="button" data-search-close aria-label="关闭搜索">ESC</button>
      </div>
      <div class="search-results" data-search-results>
        <p class="search-empty">正在准备搜索索引...</p>
      </div>
      <div class="search-panel-foot">
        <div class="search-foot-keys" aria-hidden="true">
          <span class="search-foot-item"><kbd>↑</kbd><kbd>↓</kbd><span>选择</span></span>
          <span class="search-foot-item"><kbd>↵</kbd><span>打开</span></span>
          <span class="search-foot-item"><kbd>ESC</kbd><span>关闭</span></span>
        </div>
        <span class="search-foot-status" data-search-status>全站即时检索</span>
      </div>
    </div>
  </div>

  {{/* 图片 / Mermaid 交互放大预览 Lightbox */}}
  <div class="lightbox" id="lightbox" hidden aria-modal="true" role="dialog" aria-label="图片预览">
    <div class="lightbox-bg" id="lightbox-bg"></div>
    <div class="lightbox-stage" id="lightbox-stage">
      <div class="lightbox-content" id="lightbox-body"></div>
    </div>
    <div class="lightbox-toolbar" id="lightbox-toolbar" role="toolbar" aria-label="缩放控制">
      <button class="lightbox-tool-btn" type="button" data-lb-zoom-out title="缩小 (-)" aria-label="缩小">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
      </button>
      <button class="lightbox-zoom-readout" type="button" data-lb-reset title="重置为适应屏幕 (0)" aria-label="重置缩放">100%</button>
      <button class="lightbox-tool-btn" type="button" data-lb-zoom-in title="放大 (+)" aria-label="放大">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
      </button>
      <span class="lightbox-tool-sep" aria-hidden="true"></span>
      <button class="lightbox-tool-btn lightbox-tool-text" type="button" data-lb-reset title="适应屏幕 (0)">适应</button>
    </div>
    <button class="lightbox-close" id="lightbox-close" type="button" aria-label="关闭预览" title="关闭 (ESC)">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
  </div>
</body>
</html>

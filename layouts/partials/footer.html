<footer class="site-footer">
  <div class="footer-note">
    <p>&copy; {{ now.Year }} {{ site.Title }}</p>
  </div>
  <p class="footer-links">
    <a href="{{ "index.xml" | absURL }}">RSS</a>
    {{ with site.Params.location }}
      <span>·</span>
      <span>{{ . }}</span>
    {{ end }}
  </p>
</footer>

<div class="floating-actions">
  {{ if or (and (eq .Kind "page") (strings.Contains .TableOfContents "<a")) (eq .Kind "term") (eq .Layout "archive") }}
  <button class="fab fab-toc" type="button" data-mob-drawer-toggle aria-label="目录">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="14" y2="12"></line><line x1="4" y1="18" x2="17" y2="18"></line></svg>
  </button>
  {{ end }}
  <button class="fab fab-top" type="button" data-scroll-top aria-label="回到顶部" hidden>
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
  </button>
</div>

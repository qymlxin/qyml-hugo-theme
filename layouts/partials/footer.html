<footer class="site-footer">
  <div class="footer-note">
    <p>&copy; {{ now.Year }} {{ site.Title }}</p>
  </div>
  <p class="footer-links">
    <a href="{{ "index.xml" | absURL }}">RSS</a>
    <span>·</span>
    <span>{{ site.Params.location | default "成都，中国" }}</span>
  </p>
</footer>

<div class="floating-actions">
  {{ if or (and (eq .Kind "page") .TableOfContents) (eq .Kind "term") (eq .Layout "archive") }}
  <button class="fab fab-toc" type="button" data-mob-drawer-toggle aria-label="目录">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="15" y2="12"></line><line x1="3" y1="18" x2="18" y2="18"></line></svg>
  </button>
  {{ end }}
  <button class="fab fab-top" type="button" data-scroll-top aria-label="回到顶部" hidden>
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
  </button>
  {{ if not .IsHome }}
    <a class="fab fab-home" href="{{ site.Home.RelPermalink }}" aria-label="回到首页">⌂</a>
  {{ end }}
  <button class="fab fab-theme" type="button" data-theme-toggle aria-label="切换主题">
    <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="19.78" y1="4.22" x2="18.36" y2="5.64"></line></svg>
    <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
  </button>
</div>

<header class="site-header">
  <div class="site-header-inner">
  <a class="site-title" href="{{ site.Home.RelPermalink }}">
    {{ site.Title }}
  </a>

  <nav class="site-nav" id="site-nav" data-nav>
    <a href="{{ site.Home.RelPermalink }}">首页</a>
    <a href="/posts/">文章</a>
    <a href="/categories/">分类</a>
    <a href="/tags/">标签</a>
  </nav>

  <div class="site-actions">
    <div class="search-shell" data-search-root data-search-index="{{ "index.json" | relURL }}">
      <button class="search-toggle" type="button" data-search-toggle aria-expanded="false" aria-controls="site-search-panel" aria-label="搜索">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </button>
      <div class="search-panel" id="site-search-panel" data-search-panel hidden>
        <input class="search-input" type="search" data-search-input placeholder="搜索文章..." autocomplete="off">
        <div class="search-results" data-search-results>
          <p class="search-empty">输入关键词后，结果会显示在这里。</p>
        </div>
      </div>
    </div>
    <button class="nav-toggle" type="button" data-nav-toggle aria-label="菜单" aria-expanded="false" aria-controls="site-nav">
      <svg class="icon-menu" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      <svg class="icon-close" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
  </div>
  </div>
</header>

# qyml-hugo-theme 主题默认配置
# 站点的 hugo.toml 中的同名配置会覆盖这里的值

hasCJKLanguage = true

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[pagination]
  pagerSize = 8

[markup.highlight]
  noClasses = false
  lineNos = false
  codeFences = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
  ordered = false

# ── 个人资料（在站点 hugo.toml 的 [params] 下覆盖） ──
[params]
  # author   = 'Your Name'
  # avatar   = '/images/avatar.jpg'   # 图片放 static/images/avatar.jpg
  # location = 'Shanghai, China'
  # subtitle = 'Stay hungry, stay foolish.'   # slogan

# ── 社交账号（填了才显示，没填不显示） ──
[params.social]
  # github    = ''   # GitHub 用户名
  # gitee     = ''   # Gitee 用户名
  # instagram = ''   # Instagram 用户名（不含 @）
  # telegram  = ''   # Telegram 用户名（不含 @）
  # twitter   = ''   # X/Twitter 用户名（不含 @）
  # weibo    = ''   # 微博用户名或完整 URL
  # bilibili = ''   # B站 UID 或完整 space URL
  # douyin   = ''   # 抖音主页完整 URL
  # wechat   = ''   # 微信号（显示为文字标签，不可点击）
  # qq       = ''   # QQ 号（显示为文字标签，不可点击）
  # email    = ''   # 邮箱地址
  # website  = ''   # 个人网站完整 URL

[[menus.main]]
  identifier = 'home'
  name = '首页'
  url = '/'
  weight = 10

[[menus.main]]
  identifier = 'posts'
  name = '文章'
  url = '/posts/'
  weight = 20

[[menus.main]]
  identifier = 'categories'
  name = '分类'
  url = '/categories/'
  weight = 30

[[menus.main]]
  identifier = 'tags'
  name = '标签'
  url = '/tags/'
  weight = 40

[[menus.main]]
  identifier = 'archive'
  name = '归档'
  url = '/archive/'
  weight = 50
